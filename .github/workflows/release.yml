name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      APP_NAME: GitHubCommandCenter.app
      DERIVED_DATA_ROOT: build/DerivedData
      XCODE_VERSION: "16.4"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4.0.1
        with:
          install: true

      # Release builds are produced with the Xcode 16.4 toolchain used in CI.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build (unsigned)
        run: mise run build-release

      - name: Create .zip for distribution
        run: |
          MATCHES="$(find "$DERIVED_DATA_ROOT" -type d -path "*/Build/Products/Release/$APP_NAME" -print)"
          MATCH_COUNT="$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "App bundle not found under $DERIVED_DATA_ROOT"
            exit 1
          fi

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "Multiple app bundles found under $DERIVED_DATA_ROOT:"
            printf '%s\n' "$MATCHES"
            exit 1
          fi

          APP_PATH="$(printf '%s\n' "$MATCHES" | head -n 1)"
          APP_BUNDLE_NAME="$(basename "$APP_PATH")"
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" .
          zip -r "GitHubCommandCenter-${{ github.ref_name }}.zip" "$APP_BUNDLE_NAME"
          # Print macOS installation/quarantine note to the job log.
          echo "To install: unzip, move to /Applications, then right-click > Open on first launch (unsigned build)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "GitHubCommandCenter-${{ github.ref_name }}.zip"
          body: |
            ## GitHub Command Center ${{ github.ref_name }}

            **Install:**
            1. Download the `.zip` below and unzip it
            2. Move `GitHubCommandCenter.app` to `/Applications`
            3. First launch: right-click the app → **Open** (bypasses Gatekeeper for unsigned builds)

            **Requirements:** macOS 14 (Sonoma) or later

            **Setup:** Click the menu bar icon → enter your GitHub Personal Access Token (needs `repo` read scope)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
