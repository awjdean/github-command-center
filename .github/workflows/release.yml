name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (unsigned)
        run: mise run build-release

      - name: Create .zip for distribution
        run: |
          SEARCH_DIR="build/DerivedData"
          APP_NAME="GitHubCommandCenter.app"
          APP_PATH="$SEARCH_DIR/Build/Products/Release/$APP_NAME"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" .
          zip -r "GitHubCommandCenter-${{ github.ref_name }}.zip" "$APP_NAME"
          # Strip quarantine metadata note from README context
          echo "To install: unzip, move to /Applications, then right-click > Open on first launch (unsigned build)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "GitHubCommandCenter-${{ github.ref_name }}.zip"
          body: |
            ## GitHub Command Center ${{ github.ref_name }}

            **Install:**
            1. Download the `.zip` below and unzip it
            2. Move `GitHubCommandCenter.app` to `/Applications`
            3. First launch: right-click the app → **Open** (bypasses Gatekeeper for unsigned builds)

            **Requirements:** macOS 13 (Ventura) or later

            **Setup:** Click the menu bar icon → enter your GitHub Personal Access Token (needs `repo` read scope)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
