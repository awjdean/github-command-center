name: GitHubCommandCenter
options:
  bundleIdPrefix: com.awjdean
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  GitHubCommandCenter:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GitHubCommandCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awjdean.GitHubCommandCenter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GitHubCommandCenter/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitHubCommandCenter/GitHubCommandCenter.entitlements
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
