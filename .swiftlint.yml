included:
  - GitHubCommandCenter
  - GitHubCommandCenterTests

excluded:
  - GitHubCommandCenter.xcodeproj
  - build
  - DerivedData

disabled_rules:
  - closing_brace
  - colon
  - comma
  - control_statement
  - empty_parentheses_with_trailing_closure
  - indentation_width
  - opening_brace
  - operator_usage_whitespace
  - return_arrow_whitespace
  - static_over_final_class
  - statement_position
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace
  - vertical_whitespace_between_cases

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - toggle_bool

line_length:
  warning: 120
  error: 200

file_length:
  warning: 700
  error: 1000

function_body_length:
  warning: 110
  error: 140

type_body_length:
  warning: 600
  error: 700

cyclomatic_complexity:
  warning: 20
  error: 30

identifier_name:
  min_length:
    warning: 2
    error: 1
  # Keep global exclusions empty. For legitimate API-shaped short names such as `id`,
  # use scoped inline disables instead; do not add generic shortcuts like id/x/y/i/j/k here.
  excluded: []

nesting:
  type_level:
    warning: 2
