[tools]
swiftlint = "0.63.2"
xcodegen = "2.45.3"
hk = "1.39.0"
pkl = "0.31.1" # required by hk via hk.pkl

[tasks.sync]
description = "Install all project dependencies"
run = ["mise install", "rm -rf GitHubCommandCenter.xcodeproj", "xcodegen generate"]

[tasks.open]
description = "Open project in Xcode"
depends = ["sync"]
run = "open GitHubCommandCenter.xcodeproj"

[tasks.build]
description = "Build with xcodebuild"
depends = ["sync"]
run = """
xcodebuild \
  -project GitHubCommandCenter.xcodeproj \
  -scheme GitHubCommandCenter \
  -configuration Debug \
  -destination 'platform=macOS' \
  CODE_SIGN_IDENTITY="" \
  CODE_SIGNING_REQUIRED=NO \
  CODE_SIGNING_ALLOWED=NO \
  build
"""

[tasks.build-release]
description = "Build release app bundle for packaging"
depends = ["sync"]
run = """
xcodebuild \
  -project GitHubCommandCenter.xcodeproj \
  -scheme GitHubCommandCenter \
  -configuration Release \
  -destination 'platform=macOS' \
  -derivedDataPath build/DerivedData \
  CODE_SIGN_IDENTITY="" \
  CODE_SIGNING_REQUIRED=NO \
  CODE_SIGNING_ALLOWED=NO \
  build
"""

[tasks.test]
description = "Run Swift tests with xcodebuild"
depends = ["sync"]
run = """
xcodebuild \
  -project GitHubCommandCenter.xcodeproj \
  -scheme GitHubCommandCenter \
  -configuration Debug \
  -destination 'platform=macOS' \
  CODE_SIGN_IDENTITY="" \
  CODE_SIGNING_REQUIRED=NO \
  CODE_SIGNING_ALLOWED=NO \
  test
"""

[tasks."check-style"]
description = "Check Swift formatting + lint"
depends = ["sync"]
run = [
  "swift format lint --strict --recursive GitHubCommandCenter GitHubCommandCenterTests",
  "swiftlint lint --strict",
]

[tasks."fix-style"]
description = "Auto-fix Swift formatting + lint issues"
depends = ["sync"]
run = [
  "swift format --in-place --recursive GitHubCommandCenter GitHubCommandCenterTests",
  "swiftlint lint --fix",
]

[tasks.check]
description = "Run all checks"
depends = ["sync", "check-style", "test"]

[tasks.fix]
description = "Fix all formatting + lint issues"
run = ["mise run sync", "mise run fix-style"]

[tasks.start]
description = "Build and launch the app"
depends = ["sync"]
run = """
xcodebuild \
  -project GitHubCommandCenter.xcodeproj \
  -scheme GitHubCommandCenter \
  -configuration Debug \
  -destination 'platform=macOS' \
  -derivedDataPath build/DerivedData \
  CODE_SIGN_IDENTITY="" \
  CODE_SIGNING_REQUIRED=NO \
  CODE_SIGNING_ALLOWED=NO \
  build && \
open build/DerivedData/Build/Products/Debug/GitHubCommandCenter.app
"""

[tasks."hooks:install"]
description = "Install git pre-commit hooks via hk"
run = "hk install --mise"
